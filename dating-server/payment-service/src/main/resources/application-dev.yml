server:
  port: 8084

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_history_payment
  datasource:
    url: ${DB_URL:jdbc:postgresql://38.76.188.242:5433/dating_dev_zzx?stringtype=unspecified}
    username: ${DB_USERNAME:jianjian_test}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-init-sql: SET TIME ZONE 'UTC'

grpc:
  server:
    port: 9094

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
      update-strategy: NOT_NULL

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
