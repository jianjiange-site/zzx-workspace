spring:
  application:
    name: match-service
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_history_match
  datasource:
    url: ${DB_URL:jdbc:postgresql://38.76.188.242:5433/dating_dev_zzx?stringtype=unspecified}
    username: ${DB_USERNAME:jianjian_test}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-init-sql: SET TIME ZONE 'UTC'
  data:
    redis:
      host: ${REDIS_HOST:38.76.188.242}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 2
      timeout: 3s

grpc:
  server:
    port: 9093

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      id-type: ASSIGN_ID
      update-strategy: NOT_NULL

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
