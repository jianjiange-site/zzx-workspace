syntax = "proto3";

package dating.post;

option java_package = "com.dating.proto.post";
option java_multiple_files = true;

import "common/result.proto";

service PostService {
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc GetPostDetail(GetPostDetailRequest) returns (PostInfo);
  rpc ListUserPosts(ListUserPostsRequest) returns (ListUserPostsResponse);
  rpc ActionLike(ActionLikeRequest) returns (ActionLikeResponse);
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc GetRecommendFeed(GetRecommendFeedRequest) returns (GetRecommendFeedResponse);
}

message CreatePostRequest {
  int64 user_id = 1;
  string content = 2;
  string type = 3;           // TEXT / IMAGE
  string visibility = 4;     // PUBLIC / FRIENDS / PRIVATE
  string topic = 5;
  bool allow_comment = 6;
  repeated ImageItem images = 7;
  int32 user_type = 8;       // 1=BH 2=DH
}

message ImageItem {
  string object_key = 1;
  int32 width = 2;
  int32 height = 3;
}

message CreatePostResponse {
  int64 post_id = 1;
  dating.common.Result result = 2;
}

message GetPostDetailRequest {
  int64 post_id = 1;
  int64 current_user_id = 2;
}

message PostInfo {
  int64 id = 1;
  int64 user_id = 2;
  string content = 3;
  string type = 4;
  string visibility = 5;
  string topic = 6;
  bool allow_comment = 7;
  int32 like_count = 8;
  int32 comment_count = 9;
  int32 share_count = 10;
  int32 view_count = 11;
  double score = 12;
  bool liked = 13;
  repeated ImageVO images = 14;
  int64 created_at = 15;
  int64 updated_at = 16;
  int32 user_type = 17;      // 1=BH 2=DH
  dating.common.Result result = 18;
}

message ImageVO {
  int64 id = 1;
  string object_key = 2;
  int32 width = 3;
  int32 height = 4;
  int32 sort_order = 5;
}

message ListUserPostsRequest {
  int64 user_id = 1;
  int64 current_user_id = 2;
  int32 page_size = 3;
  int64 cursor = 4;           // last post_id, 0 for first page
}

message ListUserPostsResponse {
  repeated PostInfo items = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
  dating.common.Result result = 4;
}

message ActionLikeRequest {
  int64 post_id = 1;
  int64 user_id = 2;
  bool like = 3;              // true=LIKE, false=UNLIKE
}

message ActionLikeResponse {
  bool success = 1;
  dating.common.Result result = 2;
}

message CreateCommentRequest {
  int64 post_id = 1;
  int64 user_id = 2;
  string content = 3;
  int64 parent_id = 4;
}

message CreateCommentResponse {
  int64 comment_id = 1;
  dating.common.Result result = 2;
}

message ListCommentsRequest {
  int64 post_id = 1;
  int32 page_size = 2;
  int64 cursor = 3;           // last comment_id, 0 for first page
}

message CommentInfo {
  int64 id = 1;
  int64 post_id = 2;
  int64 user_id = 3;
  int64 parent_id = 4;
  string content = 5;
  int64 created_at = 6;
}

message ListCommentsResponse {
  repeated CommentInfo comments = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
  dating.common.Result result = 4;
}

message DeleteCommentRequest {
  int64 comment_id = 1;
  int64 user_id = 2;
}

message DeleteCommentResponse {
  bool success = 1;
  dating.common.Result result = 2;
}

message DeletePostRequest {
  int64 post_id = 1;
  int64 user_id = 2;
}

message DeletePostResponse {
  bool success = 1;
  dating.common.Result result = 2;
}

message GetRecommendFeedRequest {
  int64 user_id = 1;
  int32 page_size = 2;
  string cursor = 3;          // "recOffset:csOffset"
  int32 viewer_user_type = 4; // 1=BH 2=DH, 0=unisex
}

message GetRecommendFeedResponse {
  repeated PostInfo items = 1;
  string next_cursor = 2;
  bool has_more = 3;
  dating.common.Result result = 4;
}
