syntax = "proto3";

package dating.user;

option java_package = "com.dating.proto.user";
option java_multiple_files = true;

message UserProfile {
  string user_id = 1;
  string nickname = 2;
  int32 age = 3;
  int32 gender = 4;       // 0-unknown, 1-male, 2-female
  string bio = 5;
  repeated string photos = 6;
  repeated string tags = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}
