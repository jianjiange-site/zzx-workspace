syntax = "proto3";

package dating.user;

option java_package = "com.dating.proto.user";
option java_multiple_files = true;

message UserIdentity {
  string user_id = 1;
  string phone = 2;
  string email = 3;
  int32 device_type = 4;  // 1-iOS, 2-Android
  string device_id = 5;
  int64 registered_at = 6;
}

message RegisterRequest {
  string phone = 1;
  string password = 2;
  string device_id = 3;
  int32 device_type = 4;
}

message RegisterResponse {
  string user_id = 1;
  string token = 2;
}
